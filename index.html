<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Realtime 3D Attendance Tracker</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #6366f1;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 20px; }
    
    .container { max-width: 1000px; margin: 0 auto; }
    
    /* Setup Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .card { background: var(--card-bg); padding: 30px; border-radius: 16px; border: 1px solid #334155; width: 100%; max-width: 480px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); }
    
    input[type="text"], select { width: 100%; padding: 12px; margin: 10px 0 20px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 8px; font-size: 1rem; }
    button { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    button:hover { opacity: 0.9; transform: translateY(-1px); }

    /* 3D Color Pointer Grid */
    .color-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 15px 0 25px; }
    .color-option { position: relative; height: 70px; background: #0f172a; border-radius: 10px; border: 2px solid transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .color-option.selected { border-color: var(--accent); background: #1e1b4b; }
    
    /* 3D Pointer Icon */
    .pointer-3d {
      width: 24px; height: 24px;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      box-shadow: -2px 4px 8px rgba(0,0,0,0.4), inset -2px -2px 4px rgba(0,0,0,0.3), inset 2px 2px 4px rgba(255,255,255,0.4);
    }
    .c-red { background: linear-gradient(135deg, #ef4444, #991b1b); }
    .c-blue { background: linear-gradient(135deg, #3b82f6, #1e40af); }
    .c-green { background: linear-gradient(135deg, #10b981, #065f46); }
    .c-yellow { background: linear-gradient(135deg, #f59e0b, #78350f); }
    .c-purple { background: linear-gradient(135deg, #a855f7, #581c87); }
    .c-orange { background: linear-gradient(135deg, #f97316, #9a3412); }

    /* Main Dashboard */
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px; }
    .user-stats { display: flex; gap: 15px; }
    .stat-badge { background: var(--card-bg); padding: 10px 16px; border-radius: 10px; border: 1px solid #334155; font-size: 0.9rem; }
    
    /* Calendar */
    .calendar-card { background: var(--card-bg); border-radius: 16px; border: 1px solid #334155; padding: 25px; }
    .calendar-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; text-align: center; }
    .weekday { font-weight: 600; color: var(--muted); padding-bottom: 8px; font-size: 0.85rem; }
    
    .day-cell {
      min-height: 85px; background: #0f172a; border-radius: 10px; border: 1px solid #334155; padding: 6px;
      cursor: pointer; position: relative; transition: 0.2s; display: flex; flex-direction: column; justify-content: space-between;
    }
    .day-cell:hover { border-color: var(--accent); }
    .day-cell.present { border-color: #10b981; background: #064e3b15; }
    .day-num { font-weight: 600; font-size: 0.9rem; text-align: left; }

    /* Big Pulse Wave Animation */
    .pulse-wrapper { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
    .pulse-wave {
      position: absolute; width: 45px; height: 45px; border-radius: 50%;
      border: 2px solid currentColor; animation: pulse 1.8s infinite ease-out; opacity: 0;
    }
    @keyframes pulse {
      0% { transform: scale(0.3); opacity: 1; }
      100% { transform: scale(1.8); opacity: 0; }
    }

    /* Multi-user Avatar Stack */
    .users-stack { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin-top: 4px; }
    .user-pin-indicator {
      width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.6);
      display: inline-block; title: attr(data-name);
    }
    
    .config-btn { width: auto; background: #334155; font-size: 0.8rem; padding: 6px 12px; }
  </style>
</head>
<body>

<div class="container">
  <!-- Top Bar -->
  <header>
    <div>
      <h1 id="welcomeHeader">Hey "User" 👋</h1>
      <p style="color:var(--muted); font-size: 0.9rem;">Real-Time AppsScript Sync Active</p>
    </div>
    <div class="user-stats">
      <div class="stat-badge">👥 Active Users: <strong id="totalUsersCount">1</strong></div>
      <div class="stat-badge">📅 My Presents: <strong id="myPresentsCount">0</strong></div>
      <button class="config-btn" onclick="openConfig()">⚙ AppsScript URL</button>
    </div>
  </header>

  <!-- Calendar Card -->
  <div class="calendar-card">
    <div class="calendar-controls">
      <h2 id="monthYearLabel">Select Month</h2>
      <input type="month" id="monthPicker" style="width: auto; margin: 0;" onchange="renderCalendar()">
    </div>
    <div class="calendar-grid" id="calendarGrid"></div>
  </div>
</div>

<!-- Onboarding / Registration Modal -->
<div class="modal-overlay" id="onboardModal">
  <div class="card">
    <h2>Register Profile</h2>
    <p style="color:var(--muted); font-size:0.85rem; margin-top:4px;">Enter your name and pick your 3D location pointer.</p>
    
    <label style="display:block; margin-top:15px; font-size:0.85rem;">Your Name</label>
    <input type="text" id="userNameInput" placeholder="e.g. Alex Rivera" />

    <label style="font-size:0.85rem;">Select 3D Location Pointer Icon Color</label>
    <div class="color-grid" id="colorPicker">
      <div class="color-option selected" onclick="selectColor('c-red', this)"><div class="pointer-3d c-red"></div></div>
      <div class="color-option" onclick="selectColor('c-blue', this)"><div class="pointer-3d c-blue"></div></div>
      <div class="color-option" onclick="selectColor('c-green', this)"><div class="pointer-3d c-green"></div></div>
      <div class="color-option" onclick="selectColor('c-yellow', this)"><div class="pointer-3d c-yellow"></div></div>
      <div class="color-option" onclick="selectColor('c-purple', this)"><div class="pointer-3d c-purple"></div></div>
      <div class="color-option" onclick="selectColor('c-orange', this)"><div class="pointer-3d c-orange"></div></div>
    </div>

    <button onclick="completeRegistration()">Continue to Calendar</button>
  </div>
</div>

<script>
  let config = {
    scriptUrl: localStorage.getItem('gas_url') || '',
    currentUser: JSON.parse(localStorage.getItem('user_profile') || 'null')
  };

  let selectedColorClass = 'c-red';
  let registeredUsers = [];
  
  // Set current month on init
  const today = new Date();
  document.getElementById('monthPicker').value = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}`;

  function openConfig() {
    const url = prompt("Enter your deployed Google Apps Script Web App URL:", config.scriptUrl);
    if (url !== null) {
      config.scriptUrl = url.trim();
      localStorage.setItem('gas_url', config.scriptUrl);
      syncData();
    }
  }

  function selectColor(colorClass, el) {
    document.querySelectorAll('.color-option').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
    selectedColorClass = colorClass;
  }

  function completeRegistration() {
    const name = document.getElementById('userNameInput').value.trim();
    if (!name) return alert("Please enter your name!");

    config.currentUser = {
      name: name,
      color: selectedColorClass,
      presents: [],
      lastPointerDate: null
    };

    localStorage.setItem('user_profile', JSON.stringify(config.currentUser));
    document.getElementById('onboardModal').style.display = 'none';
    
    if(!config.scriptUrl) openConfig();
    pushUserToServer();
    renderCalendar();
  }

  function toggleAttendance(dateStr) {
    if(!config.currentUser) return;
    
    let presents = config.currentUser.presents;
    const index = presents.indexOf(dateStr);
    
    if (index > -1) {
      // Toggle Absent
      presents.splice(index, 1);
      if(config.currentUser.lastPointerDate === dateStr) {
        config.currentUser.lastPointerDate = presents[presents.length - 1] || null;
      }
    } else {
      // Toggle Present & update location pointer date
      presents.push(dateStr);
      config.currentUser.lastPointerDate = dateStr;
    }
    
    localStorage.setItem('user_profile', JSON.stringify(config.currentUser));
    renderCalendar();
    pushUserToServer();
  }

  async function pushUserToServer() {
    if (!config.scriptUrl || !config.currentUser) return;
    try {
      await fetch(config.scriptUrl, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'registerOrUpdate', ...config.currentUser })
      });
      syncData();
    } catch(e) { console.error("Sync error", e); }
  }

  async function syncData() {
    if (!config.scriptUrl) return;
    try {
      const res = await fetch(`${config.scriptUrl}?action=getUsers`);
      const data = await res.json();
      if(Array.isArray(data)) {
        registeredUsers = data;
        document.getElementById('totalUsersCount').innerText = registeredUsers.length || 1;
        renderCalendar();
      }
    } catch(e) { console.log("Fetching fallback"); }
  }

  function renderCalendar() {
    if (!config.currentUser) return;

    document.getElementById('welcomeHeader').innerHTML = `Hey <strong>${config.currentUser.name}</strong> 👋`;
    document.getElementById('myPresentsCount').innerText = config.currentUser.presents.length;

    const [year, month] = document.getElementById('monthPicker').value.split('-').map(Number);
    const firstDay = new Date(year, month - 1, 1).getDay();
    const daysInMonth = new Date(year, month, 0).getDate();

    const grid = document.getElementById('calendarGrid');
    grid.innerHTML = '';

    const weekdays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    weekdays.forEach(w => grid.innerHTML += `<div class="weekday">${w}</div>`);

    for (let i = 0; i < firstDay; i++) {
      grid.innerHTML += `<div></div>`;
    }

    for (let day = 1; day <= daysInMonth; day++) {
      const dateStr = `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      const isPresent = config.currentUser.presents.includes(dateStr);
      const isMyPointer = config.currentUser.lastPointerDate === dateStr;

      // Find other users with pointers on this date
      const otherUsersWithPointer = registeredUsers.filter(u => u.name !== config.currentUser.name && u.lastPointerDate === dateStr);

      let cellHTML = `
        <div class="day-cell ${isPresent ? 'present' : ''}" onclick="toggleAttendance('${dateStr}')">
          <div class="day-num">${day}</div>
          
          ${isMyPointer ? `
            <div class="pulse-wrapper">
              <div class="pulse-wave" style="color: var(--accent)"></div>
              <div class="pointer-3d ${config.currentUser.color}"></div>
            </div>
          ` : ''}

          <div class="users-stack">
            ${otherUsersWithPointer.map(u => `
              <div class="user-pin-indicator ${u.color}" title="${u.name} (${u.presents.length} presents)"></div>
            `).join('')}
          </div>
        </div>
      `;
      grid.innerHTML += cellHTML;
    }
  }

  // Init checks
  if (!config.currentUser) {
    document.getElementById('onboardModal').style.display = 'flex';
  } else {
    document.getElementById('onboardModal').style.display = 'none';
    renderCalendar();
    syncData();
  }

  // Poll server for real-time user updates every 5 seconds
  setInterval(syncData, 5000);
</script>
</body>
</html>
