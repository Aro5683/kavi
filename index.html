<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Real-Time 3D Attendance Tracker</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151c2c;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #232d42;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* Modals & Overlays */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .card {
      background: var(--card-bg);
      padding: 32px;
      border-radius: 20px;
      border: 1px solid var(--border);
      width: 100%;
      max-width: 480px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    h2 { font-size: 1.5rem; margin-bottom: 8px; font-weight: 700; }
    p.subtext { color: var(--muted); font-size: 0.875rem; margin-bottom: 20px; line-height: 1.4; }

    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; color: var(--muted); }

    input[type="text"], input[type="url"], select {
      width: 100%;
      padding: 12px 16px;
      margin-bottom: 20px;
      background: #0b0f19;
      border: 1px solid var(--border);
      color: #fff;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus { border-color: var(--accent); }

    button {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover { background: var(--accent-hover); }
    button:active { transform: scale(0.98); }

    /* 3D Color Pointer Selection Grid */
    .color-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    .color-option {
      position: relative;
      height: 75px;
      background: #0b0f19;
      border-radius: 12px;
      border: 2px solid var(--border);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s ease;
    }

    .color-option:hover { border-color: #475569; }
    .color-option.selected { border-color: var(--accent); background: rgba(99, 102, 241, 0.1); }

    /* 3D Location Pointer Icon Styling */
    .pointer-3d {
      width: 22px;
      height: 22px;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      box-shadow: -3px 5px 10px rgba(0,0,0,0.5), inset -2px -2px 4px rgba(0,0,0,0.4), inset 2px 2px 4px rgba(255,255,255,0.5);
      position: relative;
      z-index: 2;
    }

    .pointer-3d::after {
      content: '';
      width: 8px;
      height: 8px;
      background: #fff;
      position: absolute;
      border-radius: 50%;
      top: 7px;
      left: 7px;
      box-shadow: inset 1px 1px 2px rgba(0,0,0,0.3);
    }

    /* Pointer Color Gradients */
    .c-red { background: linear-gradient(135deg, #f87171, #dc2626); }
    .c-blue { background: linear-gradient(135deg, #60a5fa, #2563eb); }
    .c-green { background: linear-gradient(135deg, #34d399, #059669); }
    .c-yellow { background: linear-gradient(135deg, #fbbf24, #d97706); }
    .c-purple { background: linear-gradient(135deg, #c084fc, #9333ea); }
    .c-orange { background: linear-gradient(135deg, #fb923c, #ea580c); }

    /* Header Styling */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .user-greeting h1 { font-size: 1.75rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
    .user-greeting p { color: var(--muted); font-size: 0.875rem; margin-top: 4px; }

    .stats-container { display: flex; gap: 12px; flex-wrap: wrap; }
    .stat-card {
      background: var(--card-bg);
      padding: 10px 18px;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-size: 0.875rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stat-card strong { color: #fff; }

    .btn-config {
      width: auto;
      background: #1e293b;
      border: 1px solid var(--border);
      font-size: 0.8rem;
      padding: 8px 14px;
    }
    .btn-config:hover { background: #334155; }

    /* Calendar Styling */
    .calendar-wrapper {
      background: var(--card-bg);
      border-radius: 20px;
      border: 1px solid var(--border);
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
    }

    .weekday-label {
      text-align: center;
      font-weight: 600;
      color: var(--muted);
      padding-bottom: 12px;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .day-cell {
      min-height: 105px;
      background: #0b0f19;
      border-radius: 14px;
      border: 1px solid var(--border);
      padding: 8px;
      cursor: pointer;
      position: relative;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: visible;
    }

    .day-cell:hover { border-color: var(--accent); transform: translateY(-2px); }
    
    .day-cell.is-present {
      border-color: #10b981;
      background: rgba(16, 185, 129, 0.05);
    }

    .day-number { font-weight: 700; font-size: 0.85rem; color: var(--muted); }
    .day-cell.is-present .day-number { color: #10b981; }

    /* Pulse Wave Animations */
    .pointer-stage {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 5;
    }

    .pulse-wave-ring {
      position: absolute;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      animation: bigPulse 2s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
      opacity: 0;
    }

    @keyframes bigPulse {
      0% { transform: scale(0.2); opacity: 1; }
      80%, 100% { transform: scale(2.2); opacity: 0; }
    }

    /* Container for Displaying Other Users' Pins */
    .others-pointer-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
      z-index: 10;
    }

    .user-presence-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2px 6px;
      font-size: 0.7rem;
      color: #f8fafc;
      box-shadow: 0 2px 5px rgba(0,0,0,0.4);
    }

    .user-presence-badge .badge-pin {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    .empty-cell { visibility: hidden; }
  </style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <header>
    <div class="user-greeting">
      <h1 id="userHeader">Hey "User" <span id="headerPointerIcon"></span></h1>
      <p id="syncStatus">Real-time AppsScript Cloud Synchronization Active</p>
    </div>
    <div class="stats-container">
      <div class="stat-card">👥 Active Users: <strong id="totalUsers">0</strong></div>
      <div class="stat-card">📅 My Presents: <strong id="myPresentCount">0</strong></div>
      <button class="btn-config" onclick="openScriptUrlModal()">⚙ Setup Script URL</button>
    </div>
  </header>

  <!-- Calendar View -->
  <div class="calendar-wrapper">
    <div class="calendar-header">
      <h2 id="currentMonthYearText">Calendar</h2>
      <input type="month" id="monthSelector" style="width: auto; margin-bottom: 0;" onchange="renderCalendar()">
    </div>
    <div class="calendar-grid" id="calendarGrid"></div>
  </div>
</div>

<!-- Onboarding Modal -->
<div class="modal-overlay" id="onboardModal">
  <div class="card">
    <h2>Welcome!</h2>
    <p class="subtext">Enter your name and pick a 3D location pointer color to register into the attendance system.</p>

    <label>Your Name</label>
    <input type="text" id="inputName" placeholder="Enter full name" />

    <label>Choose 3D Pointer Icon Color</label>
    <div class="color-grid" id="colorGrid">
      <div class="color-option selected" onclick="selectColor('c-red', this)"><div class="pointer-3d c-red"></div></div>
      <div class="color-option" onclick="selectColor('c-blue', this)"><div class="pointer-3d c-blue"></div></div>
      <div class="color-option" onclick="selectColor('c-green', this)"><div class="pointer-3d c-green"></div></div>
      <div class="color-option" onclick="selectColor('c-yellow', this)"><div class="pointer-3d c-yellow"></div></div>
      <div class="color-option" onclick="selectColor('c-purple', this)"><div class="pointer-3d c-purple"></div></div>
      <div class="color-option" onclick="selectColor('c-orange', this)"><div class="pointer-3d c-orange"></div></div>
    </div>

    <button onclick="saveRegistration()">Continue to Calendar</button>
  </div>
</div>

<!-- AppsScript URL Setup Modal -->
<div class="modal-overlay" id="scriptUrlModal" style="display: none;">
  <div class="card">
    <h2>Connect Google AppsScript</h2>
    <p class="subtext">Paste your deployed Google Apps Script Web App URL below.</p>

    <label>Google Apps Script Web App URL</label>
    <input type="url" id="inputScriptUrl" placeholder="https://script.google.com/macros/s/.../exec" />

    <button onclick="saveScriptUrl()">Save & Sync</button>
    <button style="background: transparent; border: 1px solid var(--border); margin-top: 10px;" onclick="closeScriptUrlModal()">Cancel</button>
  </div>
</div>

<script>
  let state = {
    scriptUrl: localStorage.getItem('gas_url') || 'https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnQcS4yUNlLJ8PGQvZtcFrwE0S2zmm6b1gtYymFyyuJEDo-agAKPN-lnWEhBYQ9Ft0-H0V2VyzCGS1jCrnCUI3kCDEjDYnAhiq1yqva5xF23QOaK-9VoCKd5SLeFGeylGq68sMHg7AV67c71NP_H8ffFCntPY-3qsvNicDYDKAa3HWAnt21p1bPDzwxmSXATR9rTFxvAIxhIOIMSLIW7OR6Gqx6Xp50VVNWwDK44pl-Q3U87nUbTZi46K0SzrTZEixYZNpvbB2MejEmJKBgSKr0HpiJ-xw&lib=MDSMCZXETSEQiuX4DXJ_tcbhb8GuvlFSd',
    user: JSON.parse(localStorage.getItem('user_profile') || 'null'),
    selectedColor: 'c-red',
    allUsers: []
  };

  // Set current month on init
  const now = new Date();
  document.getElementById('monthSelector').value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;

  function normalizeDate(dateVal) {
    if (!dateVal) return '';
    return dateVal.split('T')[0];
  }

  function selectColor(colorClass, element) {
    document.querySelectorAll('.color-option').forEach(el => el.classList.remove('selected'));
    element.classList.add('selected');
    state.selectedColor = colorClass;
  }

  function saveRegistration() {
    const name = document.getElementById('inputName').value.trim();
    if (!name) return alert('Please enter your name.');

    state.user = {
      name: name,
      color: state.selectedColor,
      presents: [],
      lastPointerDate: null
    };

    localStorage.setItem('user_profile', JSON.stringify(state.user));
    document.getElementById('onboardModal').style.display = 'none';

    pushDataToServer();
    renderCalendar();
  }

  function openScriptUrlModal() {
    document.getElementById('inputScriptUrl').value = state.scriptUrl;
    document.getElementById('scriptUrlModal').style.display = 'flex';
  }

  function closeScriptUrlModal() {
    document.getElementById('scriptUrlModal').style.display = 'none';
  }

  function saveScriptUrl() {
    const url = document.getElementById('inputScriptUrl').value.trim();
    state.scriptUrl = url;
    localStorage.setItem('gas_url', url);
    closeScriptUrlModal();
    fetchDataFromServer();
  }

  function toggleAttendance(dateStr) {
    if (!state.user) return;

    const presents = state.user.presents;
    const index = presents.indexOf(dateStr);

    if (index > -1) {
      // Toggle Absent
      presents.splice(index, 1);
      if (normalizeDate(state.user.lastPointerDate) === dateStr) {
        state.user.lastPointerDate = presents[presents.length - 1] || null;
      }
    } else {
      // Toggle Present and set location pointer
      presents.push(dateStr);
      state.user.lastPointerDate = dateStr;
    }

    localStorage.setItem('user_profile', JSON.stringify(state.user));
    renderCalendar();
    pushDataToServer();
  }

  async function pushDataToServer() {
    if (!state.scriptUrl || !state.user) return;
    try {
      const payload = new URLSearchParams({
        action: 'registerOrUpdate',
        name: state.user.name,
        color: state.user.color,
        presents: JSON.stringify(state.user.presents),
        lastPointerDate: state.user.lastPointerDate || ''
      });

      await fetch(state.scriptUrl, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: payload.toString()
      });

      fetchDataFromServer();
    } catch (e) {
      console.error('Server Push Error:', e);
    }
  }

  async function fetchDataFromServer() {
    if (!state.scriptUrl) return;
    try {
      const res = await fetch(`${state.scriptUrl}${state.scriptUrl.includes('?') ? '&' : '?'}action=getUsers`);
      const data = await res.json();
      if (Array.isArray(data)) {
        state.allUsers = data;
        document.getElementById('totalUsers').innerText = state.allUsers.length;
        renderCalendar();
      }
    } catch (e) {
      console.error('Server Sync Error:', e);
    }
  }

  function renderCalendar() {
    if (!state.user) return;

    document.getElementById('userHeader').innerHTML = `Hey "<strong>${state.user.name}</strong>" <div class="pointer-3d ${state.user.color}" style="display:inline-block; transform: scale(0.8) rotate(-45deg);"></div>`;
    document.getElementById('myPresentCount').innerText = state.user.presents.length;

    const [year, month] = document.getElementById('monthSelector').value.split('-').map(Number);
    const firstDayIndex = new Date(year, month - 1, 1).getDay();
    const totalDaysInMonth = new Date(year, month, 0).getDate();

    const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    document.getElementById('currentMonthYearText').innerText = `${monthNames[month - 1]} ${year}`;

    const grid = document.getElementById('calendarGrid');
    grid.innerHTML = '';

    const weekdays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    weekdays.forEach(w => grid.innerHTML += `<div class="weekday-label">${w}</div>`);

    for (let i = 0; i < firstDayIndex; i++) {
      grid.innerHTML += `<div class="empty-cell"></div>`;
    }

    for (let day = 1; day <= totalDaysInMonth; day++) {
      const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      const isPresent = state.user.presents.includes(dateStr);
      
      const myNormalizedPointer = normalizeDate(state.user.lastPointerDate);
      const isMyActivePointer = myNormalizedPointer === dateStr;

      // Find other users who have their location pointer on this date
      const otherUsersWithPointerOnDate = state.allUsers.filter(u => {
        return u.name.toLowerCase() !== state.user.name.toLowerCase() && normalizeDate(u.lastPointerDate) === dateStr;
      });

      let cellHTML = `
        <div class="day-cell ${isPresent ? 'is-present' : ''}" onclick="toggleAttendance('${dateStr}')">
          <div class="day-number">${day}</div>

          ${isMyActivePointer ? `
            <div class="pointer-stage">
              <div class="pulse-wave-ring"></div>
              <div class="pointer-3d ${state.user.color}"></div>
            </div>
          ` : ''}

          <div class="others-pointer-container">
            ${otherUsersWithPointerOnDate.map(u => `
              <div class="user-presence-badge">
                <span class="badge-pin ${u.color}"></span>
                <span>${u.name} (${u.presents ? u.presents.length : 0} days)</span>
              </div>
            `).join('')}
          </div>
        </div>
      `;

      grid.innerHTML += cellHTML;
    }
  }

  // App Initialization
  if (!state.user) {
    document.getElementById('onboardModal').style.display = 'flex';
  } else {
    document.getElementById('onboardModal').style.display = 'none';
    renderCalendar();
    fetchDataFromServer();
  }

  // Auto-sync from server every 5 seconds
  setInterval(fetchDataFromServer, 5000);
</script>
</body>
</html>
