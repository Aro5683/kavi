<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Slow Ludo Chatbot Attendance</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
        
        @keyframes bounce-pawn {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-4px) scale(1.1); }
        }
        .pawn-anim { animation: bounce-pawn 1.8s infinite ease-in-out; }

        /* Chatbot Bubble Animation */
        @keyframes pop-in {
            0% { transform: scale(0.8) translateY(10px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        .chat-pop { animation: pop-in 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between bg-slate-950 text-slate-100 antialiased selection:bg-rose-500 selection:text-white pb-24">

    <!-- Onboarding / Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl relative">
            <div class="w-16 h-16 bg-rose-500/10 border border-rose-500/30 text-rose-500 rounded-2xl flex items-center justify-center text-3xl mx-auto mb-3">
                <i class="fa-solid fa-chess-pawn"></i>
            </div>
            <h2 class="text-xl font-black mb-1">Customize Your Pawn 🎲</h2>
            <p class="text-slate-400 text-xs mb-5">Set your player name and pick your Ludo pointer color!</p>
            
            <form onsubmit="saveUserSettings(event)" class="space-y-4">
                <div>
                    <label class="block text-left text-xs font-bold text-slate-400 mb-1">Your Name</label>
                    <input type="text" id="inputUsername" required placeholder="e.g. Aro or Kavi" class="w-full bg-slate-950 border border-slate-800 text-white rounded-xl px-4 py-3 font-extrabold outline-none focus:border-rose-500 transition">
                </div>

                <div>
                    <label class="block text-left text-xs font-bold text-slate-400 mb-2">Pointer Color</label>
                    <div class="grid grid-cols-6 gap-2">
                        <button type="button" onclick="selectColor('red')" class="color-btn h-9 rounded-xl bg-red-500 border-2 border-white flex items-center justify-center" data-color="red">🔴</button>
                        <button type="button" onclick="selectColor('blue')" class="color-btn h-9 rounded-xl bg-blue-500 border-2 border-transparent flex items-center justify-center" data-color="blue">🔵</button>
                        <button type="button" onclick="selectColor('emerald')" class="color-btn h-9 rounded-xl bg-emerald-500 border-2 border-transparent flex items-center justify-center" data-color="emerald">🟢</button>
                        <button type="button" onclick="selectColor('purple')" class="color-btn h-9 rounded-xl bg-purple-500 border-2 border-transparent flex items-center justify-center" data-color="purple">🟣</button>
                        <button type="button" onclick="selectColor('amber')" class="color-btn h-9 rounded-xl bg-amber-500 border-2 border-transparent flex items-center justify-center" data-color="amber">🟠</button>
                        <button type="button" onclick="selectColor('pink')" class="color-btn h-9 rounded-xl bg-pink-500 border-2 border-transparent flex items-center justify-center" data-color="pink">🩷</button>
                    </div>
                </div>

                <button type="submit" class="w-full bg-gradient-to-r from-rose-600 to-red-600 hover:from-rose-500 hover:to-red-500 text-white font-extrabold py-3.5 rounded-2xl shadow-lg shadow-rose-600/20 transition active:scale-95 text-sm">
                    Ready to Play! 🚀
                </button>
            </form>
        </div>
    </div>

    <!-- Header Navigation -->
    <header class="bg-slate-900/90 border-b border-slate-800 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div id="playerAvatar" class="w-10 h-10 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-xl shadow-md">
                    🔴
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <h1 id="playerGreeting" class="font-black text-base sm:text-lg text-white">Player</h1>
                        <button onclick="openSettingsModal()" class="text-slate-500 hover:text-slate-300 text-xs p-1" title="Customize Pawn"><i class="fa-solid fa-palette"></i> Edit</button>
                    </div>
                    <p class="text-[11px] text-slate-400">Slow Ludo School Attendance</p>
                </div>
            </div>

            <!-- Leaderboard -->
            <div id="leaderboardBar" class="flex items-center gap-2 bg-slate-950 border border-slate-800 px-3 py-1.5 rounded-2xl text-xs font-bold">
                <span class="text-slate-500">Scores:</span>
                <span id="scoreDisplay" class="text-white">Aro: 0 | Kavi: 0</span>
            </div>
        </div>
    </header>

    <!-- Main Canvas -->
    <main class="max-w-4xl w-full mx-auto px-3 sm:px-6 py-4 flex-grow space-y-4">
        
        <section class="bg-slate-900 border border-slate-800 rounded-3xl p-3 sm:p-5 shadow-2xl relative overflow-hidden">
            
            <div class="flex items-center justify-between gap-2 mb-4 pb-3 border-b border-slate-800">
                <div class="flex items-center gap-2">
                    <button onclick="navigateMonth(-1)" class="w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center text-xs transition"><i class="fa-solid fa-chevron-left"></i></button>
                    <span id="monthYearTitle" class="font-extrabold text-sm sm:text-base text-white px-2">September 2026</span>
                    <button onclick="navigateMonth(1)" class="w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center text-xs transition"><i class="fa-solid fa-chevron-right"></i></button>
                </div>

                <button onclick="jumpToToday()" class="bg-rose-500/10 border border-rose-500/30 text-rose-400 hover:bg-rose-500/20 text-xs font-bold px-3 py-2 rounded-xl transition">Jump to Today</button>
            </div>

            <div class="calendar-grid gap-1 sm:gap-2 text-center mb-2">
                <div class="text-[10px] font-black text-rose-500 uppercase tracking-wider py-1">Sun</div>
                <div class="text-[10px] font-black text-slate-500 uppercase tracking-wider py-1">Mon</div>
                <div class="text-[10px] font-black text-slate-500 uppercase tracking-wider py-1">Tue</div>
                <div class="text-[10px] font-black text-slate-500 uppercase tracking-wider py-1">Wed</div>
                <div class="text-[10px] font-black text-slate-500 uppercase tracking-wider py-1">Thu</div>
                <div class="text-[10px] font-black text-slate-500 uppercase tracking-wider py-1">Fri</div>
                <div class="text-[10px] font-black text-emerald-500 uppercase tracking-wider py-1">Sat</div>
            </div>

            <div id="calendarGrid" class="calendar-grid gap-1.5 sm:gap-2"></div>
        </section>
    </main>

    <!-- Chatbot Assistant Popup -->
    <div class="fixed bottom-3 left-0 right-0 max-w-lg mx-auto px-4 z-40 pointer-events-none">
        <div id="chatbotCard" class="bg-slate-900/95 border border-slate-700/80 backdrop-blur-xl p-3.5 rounded-2xl shadow-2xl flex items-start gap-3 pointer-events-auto chat-pop">
            <div id="botAvatar" class="w-10 h-10 rounded-xl bg-gradient-to-tr from-rose-500 to-amber-500 flex items-center justify-center text-xl shadow-md flex-shrink-0 animate-bounce">
                🤖
            </div>
            <div class="flex-grow min-w-0">
                <div class="flex items-center justify-between">
                    <span class="text-[11px] font-extrabold uppercase tracking-wider text-rose-400">Ludo Bot Assistant</span>
                    <span id="botMood" class="text-[10px] bg-slate-800 text-slate-300 px-2 py-0.5 rounded-full font-bold">Surprised! 😲</span>
                </div>
                <p id="botSpeech" class="text-xs text-slate-200 font-semibold mt-1 leading-snug">
                    Hey! Step onto today's date tile to race your Ludo pawn forward!
                </p>
            </div>
        </div>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyT-WY8onYoUHI-kQMWtIFGBuaotdBYzWYvG7FHBpkUhRh7eCduTAzfhVrIvgeAMdaG/exec";

        let state = {
            currentUser: localStorage.getItem('ludo_app_user') || 'Aro',
            currentColor: localStorage.getItem('ludo_app_color') || 'red',
            allAttendance: {},
            userProfiles: {},
            viewYear: new Date().getFullYear(),
            viewMonth: new Date().getMonth()
        };

        const colorClasses = {
            red: { bg: 'bg-red-500', text: 'text-red-500', shadow: 'rgba(239, 68, 68, 0.8)', emoji: '🔴' },
            blue: { bg: 'bg-blue-500', text: 'text-blue-500', shadow: 'rgba(59, 130, 246, 0.8)', emoji: '🔵' },
            emerald: { bg: 'bg-emerald-500', text: 'text-emerald-500', shadow: 'rgba(16, 185, 129, 0.8)', emoji: '🟢' },
            purple: { bg: 'bg-purple-500', text: 'text-purple-500', shadow: 'rgba(168, 85, 247, 0.8)', emoji: '🟣' },
            amber: { bg: 'bg-amber-500', text: 'text-amber-500', shadow: 'rgba(245, 158, 11, 0.8)', emoji: '🟠' },
            pink: { bg: 'bg-pink-500', text: 'text-pink-500', shadow: 'rgba(236, 72, 153, 0.8)', emoji: '🩷' }
        };

        const settingsModal = document.getElementById('settingsModal');
        const inputUsername = document.getElementById('inputUsername');
        const calendarGrid = document.getElementById('calendarGrid');
        const monthYearTitle = document.getElementById('monthYearTitle');
        const playerGreeting = document.getElementById('playerGreeting');
        const playerAvatar = document.getElementById('playerAvatar');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const botSpeech = document.getElementById('botSpeech');
        const botMood = document.getElementById('botMood');
        const botAvatar = document.getElementById('botAvatar');

        function openSettingsModal() {
            inputUsername.value = state.currentUser;
            selectColor(state.currentColor);
            settingsModal.classList.remove('hidden');
        }

        function selectColor(col) {
            state.currentColor = col;
            document.querySelectorAll('.color-btn').forEach(btn => {
                if (btn.dataset.color === col) {
                    btn.classList.replace('border-transparent', 'border-white');
                } else {
                    btn.classList.replace('border-white', 'border-transparent');
                }
            });
        }

        function saveUserSettings(e) {
            e.preventDefault();
            const val = inputUsername.value.trim();
            if (val) {
                state.currentUser = val;
                localStorage.setItem('ludo_app_user', val);
                localStorage.setItem('ludo_app_color', state.currentColor);
                updateHeaderUI();
                settingsModal.classList.add('hidden');
                fetchAllData();
                triggerBotTalk('customized');
            }
        }

        function updateHeaderUI() {
            const conf = colorClasses[state.currentColor] || colorClasses.red;
            playerGreeting.innerText = state.currentUser;
            playerAvatar.innerText = conf.emoji;
        }

        async function fetchAllData() {
            try {
                const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=getAllData`);
                const data = await res.json();
                if (data.status === "success") {
                    state.allAttendance = data.allAttendance || {};
                    state.userProfiles = data.userProfiles || {};
                    renderBoard();
                }
            } catch (err) {
                renderBoard();
            }
        }

        async function saveAttendance(dateKey, isPresent) {
            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({
                        action: "saveAttendance",
                        user: state.currentUser,
                        color: state.currentColor,
                        dateKey: dateKey,
                        status: isPresent ? "PRESENT" : "ABSENT"
                    })
                });
            } catch(e) {}
        }

        function navigateMonth(delta) {
            state.viewMonth += delta;
            if (state.viewMonth > 11) { state.viewMonth = 0; state.viewYear++; }
            else if (state.viewMonth < 0) { state.viewMonth = 11; state.viewYear--; }
            renderBoard();
        }

        function jumpToToday() {
            const now = new Date();
            state.viewYear = now.getFullYear();
            state.viewMonth = now.getMonth();
            renderBoard();
        }

        function renderBoard() {
            calendarGrid.innerHTML = '';
            
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            monthYearTitle.innerText = `${monthNames[state.viewMonth]} ${state.viewYear}`;

            const year = state.viewYear;
            const month = state.viewMonth;

            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDaysInMonth = new Date(year, month + 1, 0).getDate();
            const today = new Date();
            const isCurrentMonthView = (today.getFullYear() === year && today.getMonth() === month);

            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'min-h-[64px] sm:min-h-[76px] bg-slate-950/50 border border-slate-900 rounded-2xl opacity-20 pointer-events-none';
                calendarGrid.appendChild(emptyCell);
            }

            let scores = {};

            for (let day = 1; day <= totalDaysInMonth; day++) {
                const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                
                let presentUsersOnTile = [];

                for (let user in state.allAttendance) {
                    if (state.allAttendance[user][dateKey]) {
                        presentUsersOnTile.push(user);
                        scores[user] = (scores[user] || 0) + 1;
                    }
                }

                const isToday = isCurrentMonthView && (day === today.getDate());

                const tile = document.createElement('div');
                tile.className = `min-h-[64px] sm:min-h-[76px] rounded-2xl p-1.5 flex flex-col justify-between items-center cursor-pointer select-none border transition-all duration-200 relative ${
                    isToday ? 'border-rose-500 bg-slate-800/80 ring-2 ring-rose-500/20' : 'border-slate-800 bg-slate-900/60 hover:bg-slate-800/50'
                }`;

                let pawnsHTML = '';

                if (presentUsersOnTile.length > 0) {
                    pawnsHTML = `<div class="flex items-center justify-center gap-1 bg-slate-950/80 px-2 py-1 rounded-xl border border-slate-700 shadow-lg pawn-anim">`;
                    presentUsersOnTile.forEach(u => {
                        let cKey = (u === state.currentUser) ? state.currentColor : (state.userProfiles[u]?.color || 'blue');
                        let conf = colorClasses[cKey] || colorClasses.red;
                        pawnsHTML += `<i class="fa-solid fa-chess-pawn ${conf.text} text-lg sm:text-xl" title="${u}"></i>`;
                    });
                    pawnsHTML += `</div>`;
                } else {
                    pawnsHTML = `<span class="text-[10px] text-slate-700">--</span>`;
                }

                tile.innerHTML = `
                    <div class="w-full flex items-center justify-between text-[11px] font-extrabold ${isToday ? 'text-rose-400' : 'text-slate-400'}">
                        <span>${day}</span>
                        ${isToday ? '<span class="text-[8px] bg-rose-500 text-white px-1 rounded-md">TODAY</span>' : ''}
                    </div>
                    <div class="my-auto">${pawnsHTML}</div>
                `;

                tile.addEventListener('click', () => {
                    const userRecords = state.allAttendance[state.currentUser] || {};
                    const currentlyPresent = !!userRecords[dateKey];
                    
                    if (!state.allAttendance[state.currentUser]) {
                        state.allAttendance[state.currentUser] = {};
                    }

                    if (currentlyPresent) {
                        delete state.allAttendance[state.currentUser][dateKey];
                        saveAttendance(dateKey, false);
                        triggerBotTalk('absent', day);
                    } else {
                        state.allAttendance[state.currentUser][dateKey] = true;
                        saveAttendance(dateKey, true);
                        triggerBotTalk('present', day);
                    }

                    renderBoard();
                });

                calendarGrid.appendChild(tile);
            }

            // Update Leaderboard Bar
            let scoreText = [];
            for (let u in scores) {
                scoreText.push(`${u}: ${scores[u]}`);
            }
            scoreDisplay.innerText = scoreText.length ? scoreText.join(" | ") : "No scores yet";
        }

        // EMOTIONAL CHATBOT DIALOGUE ENGINE
        function triggerBotTalk(event, day) {
            let msg = "";
            let mood = "Happy! 😀";
            let avatar = "🤖";

            if (event === 'present') {
                const reactions = [
                    `WOAH! ${state.currentUser} stepped onto Day ${day}! Moving like a true Ludo master! 🎲🔥`,
                    `YES! ${state.currentUser} marked present for Day ${day}! School streak is ON! 🚀`,
                    `BOOM! Day ${day} secured! ${state.currentUser}'s Ludo pawn advances forward! 🎯`,
                    `Unstoppable! ${state.currentUser} just claimed Day ${day}! What a legend! 👑`
                ];
                msg = reactions[Math.floor(Math.random() * reactions.length)];
                mood = "Hyped! 🔥";
                avatar = "💥";
            } else if (event === 'absent') {
                const reactions = [
                    `OH NO! ${state.currentUser} stepped back from Day ${day}... Kavi might overtake you! 😱`,
                    `WAIT! Taking leave on Day ${day}? The pawn moved back! 🙈`,
                    `GASP! ${state.currentUser} removed attendance on Day ${day}! Don't fall behind! ⚠️`
                ];
                msg = reactions[Math.floor(Math.random() * reactions.length)];
                mood = "Shocked! 😲";
                avatar = "😱";
            } else if (event === 'customized') {
                msg = `Looking sleek! ${state.currentUser} updated their style with the ${state.currentColor.toUpperCase()} Ludo Pawn! 🎨`;
                mood = "Stylish! ✨";
                avatar = "😎";
            }

            botSpeech.innerText = msg;
            botMood.innerText = mood;
            botAvatar.innerText = avatar;

            const card = document.getElementById('chatbotCard');
            card.classList.remove('chat-pop');
            void card.offsetWidth; // Trigger reflow
            card.classList.add('chat-pop');
        }

        window.onload = function() {
            updateHeaderUI();
            if (!localStorage.getItem('ludo_app_user')) {
                openSettingsModal();
            } else {
                fetchAllData();
            }
        };
    </script>
</body>
</html>
