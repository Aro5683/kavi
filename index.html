<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ludo Attendance Tracker</title>
  <style>
    :root {
      --ludo-red: #ff3b30;
      --ludo-green: #34c759;
      --ludo-yellow: #ffcc00;
      --ludo-blue: #007aff;
      --bg-dark: #0f172a;
      --panel-bg: rgba(30, 41, 59, 0.85);
      --text-main: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #090d16;
      background-image: 
        radial-gradient(at 0% 0%, rgba(255, 59, 48, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(52, 199, 89, 0.15) 0px, transparent 50%),
        radial-gradient(at 0% 100%, rgba(0, 122, 255, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(255, 204, 0, 0.15) 0px, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Registration Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-box {
      background: #1e293b;
      border: 3px solid var(--ludo-yellow);
      border-radius: 16px;
      padding: 25px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 0 25px rgba(255, 204, 0, 0.3);
      text-align: center;
    }

    .modal-box h2 {
      margin-bottom: 15px;
      color: var(--ludo-yellow);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.9rem;
      color: #94a3b8;
    }

    .input-group input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      font-size: 1rem;
      outline: none;
    }

    .color-options {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .color-btn {
      flex: 1;
      height: 45px;
      border-radius: 8px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }

    .color-btn:hover { transform: scale(1.05); }
    .color-btn.selected { border-color: white; transform: scale(1.1); }
    .color-red { background: var(--ludo-red); }
    .color-green { background: var(--ludo-green); }
    .color-yellow { background: var(--ludo-yellow); }
    .color-blue { background: var(--ludo-blue); }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background: var(--ludo-green);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    /* Main Container */
    .app-container {
      width: 100%;
      max-width: 700px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Header */
    header {
      background: var(--panel-bg);
      border: 2px solid #334155;
      border-radius: 12px;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .user-badge {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid white;
    }

    /* Leaderboard */
    .leaderboard-panel {
      background: var(--panel-bg);
      border: 2px solid #334155;
      border-radius: 12px;
      padding: 15px;
    }

    .leaderboard-panel h3 {
      font-size: 1.1rem;
      color: var(--ludo-yellow);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .leaderboard-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 150px;
      overflow-y: auto;
    }

    .leader-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      padding: 8px 12px;
      border-radius: 8px;
      border-left: 4px solid transparent;
    }

    .leader-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Calendar Controls */
    .calendar-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--panel-bg);
      padding: 10px 15px;
      border-radius: 12px;
      border: 1px solid #334155;
    }

    .calendar-controls select {
      background: #0f172a;
      color: white;
      border: 1px solid #334155;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
    }

    /* Board & Calendar Grid */
    .ludo-board {
      background: #1e293b;
      border: 4px solid #334155;
      border-radius: 16px;
      padding: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      position: relative;
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-weight: bold;
      color: #64748b;
      margin-bottom: 10px;
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }

    .day-card {
      aspect-ratio: 1;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 4px;
      position: relative;
      cursor: pointer;
      user-select: none;
      transition: background 0.2s, transform 0.1s;
    }

    .day-card:hover {
      background: #1e293b;
      transform: translateY(-2px);
    }

    .day-card.empty {
      background: transparent;
      border: none;
      cursor: default;
    }

    .day-number {
      font-size: 0.85rem;
      font-weight: bold;
      align-self: flex-start;
      color: #94a3b8;
    }

    .day-card.today {
      border-color: var(--ludo-yellow);
    }

    .day-card.present {
      background: rgba(52, 199, 89, 0.1);
      border-color: var(--ludo-green);
    }

    /* Pointers & Animations */
    .pointers-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 2px;
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* 3D Pin Pointer Styles */
    .pin {
      width: 14px;
      height: 14px;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      position: relative;
      box-shadow: 0px 2px 4px rgba(0,0,0,0.5);
      transition: all 0.3s ease;
      z-index: 2;
    }

    .pin::after {
      content: '';
      width: 6px;
      height: 6px;
      margin: 4px 0 0 4px;
      background: #fff;
      position: absolute;
      border-radius: 50%;
    }

    /* Active Big 3D Pin with Pulse Wave */
    .pin.active-big {
      width: 22px;
      height: 22px;
      z-index: 10;
    }

    .pin.active-big::after {
      width: 8px;
      height: 8px;
      margin: 7px 0 0 7px;
    }

    /* Radar Pulse Wave */
    .pulse-wave {
      position: absolute;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: transparent;
      border: 2px solid;
      opacity: 0;
      animation: pulse 1.8s infinite ease-out;
      pointer-events: none;
    }

    @keyframes pulse {
      0% {
        transform: scale(0.3);
        opacity: 1;
      }
      100% {
        transform: scale(2.2);
        opacity: 0;
      }
    }

    /* Responsive Design */
    @media (max-width: 480px) {
      .day-number { font-size: 0.75rem; }
      .pin { width: 10px; height: 10px; }
      .pin::after { width: 4px; height: 4px; margin: 3px 0 0 3px; }
      .pin.active-big { width: 16px; height: 16px; }
      .pin.active-big::after { width: 6px; height: 6px; margin: 5px 0 0 5px; }
    }
  </style>
</head>
<body>

  <!-- Registration Modal -->
  <div id="registrationModal" class="modal-overlay" style="display: none;">
    <div class="modal-box">
      <h2>🎲 Player Join</h2>
      <div class="input-group">
        <label for="username">Enter Your Name:</label>
        <input type="text" id="username" placeholder="e.g. Rahul" maxlength="20">
      </div>
      <div class="input-group">
        <label>Choose Token Color:</label>
        <div class="color-options">
          <button class="color-btn color-red selected" data-color="#ff3b30"></button>
          <button class="color-btn color-green" data-color="#34c759"></button>
          <button class="color-btn color-yellow" data-color="#ffcc00"></button>
          <button class="color-btn color-blue" data-color="#007aff"></button>
        </div>
      </div>
      <button class="btn-submit" onclick="registerUser()">Start Playing</button>
    </div>
  </div>

  <!-- Main App Container -->
  <div class="app-container">
    <header>
      <div class="user-badge">
        <div id="userAvatar" class="user-avatar" style="background: var(--ludo-red);"></div>
        <div>
          <div style="font-size: 0.8rem; color: #94a3b8;">WELCOME PLAYER</div>
          <div id="userGreeting" style="font-weight: bold; font-size: 1.1rem;">Hey, Player</div>
        </div>
      </div>
      <div id="syncStatus" style="font-size: 0.8rem; color: var(--ludo-green);">● Live Sync</div>
    </header>

    <!-- Leaderboard Panel -->
    <div class="leaderboard-panel">
      <h3>🏆 Attendance Leaderboard</h3>
      <div id="leaderboardList" class="leaderboard-list">
        <div style="color: #64748b; font-size: 0.9rem;">Loading live scores...</div>
      </div>
    </div>

    <!-- Calendar Controls -->
    <div class="calendar-controls">
      <select id="monthSelect" onchange="renderCalendar()"></select>
      <select id="yearSelect" onchange="renderCalendar()"></select>
    </div>

    <!-- Ludo Board Calendar -->
    <div class="ludo-board">
      <div class="weekdays">
        <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
      </div>
      <div id="daysGrid" class="days-grid"></div>
    </div>
  </div>

  <script>
    // Your Apps Script URL
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxKsxDxv-PFZTZRpRokl5Snsz4XFg2CMEruVJr2KBhx26JSQW19ym1J8d60IpEtbRSX/exec";

    let currentUser = null;
    let selectedColor = "#ff3b30";
    let activeLatestDateStr = null; 
    let globalAttendanceData = []; 
    let globalUsers = []; 

    const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

    window.onload = function() {
      initControls();
      checkRegistration();
      fetchLiveData();
      // Auto refresh data every 8 seconds for live user syncing
      setInterval(fetchLiveData, 8000);
    };

    function initControls() {
      const monthSel = document.getElementById("monthSelect");
      const yearSel = document.getElementById("yearSelect");
      const now = new Date();

      months.forEach((m, idx) => {
        const opt = document.createElement("option");
        opt.value = idx;
        opt.textContent = m;
        if(idx === now.getMonth()) opt.selected = true;
        monthSel.appendChild(opt);
      });

      const currentYear = now.getFullYear();
      for(let y = currentYear - 1; y <= currentYear + 2; y++) {
        const opt = document.createElement("option");
        opt.value = y;
        opt.textContent = y;
        if(y === currentYear) opt.selected = true;
        yearSel.appendChild(opt);
      }

      document.querySelectorAll(".color-btn").forEach(btn => {
        btn.addEventListener("click", function() {
          document.querySelectorAll(".color-btn").forEach(b => b.classList.remove("selected"));
          this.classList.add("selected");
          selectedColor = this.getAttribute("data-color");
        });
      });
    }

    function checkRegistration() {
      const stored = localStorage.getItem("ludo_tracker_user");
      if(stored) {
        currentUser = JSON.parse(stored);
        updateUserUI();
      } else {
        document.getElementById("registrationModal").style.display = "flex";
      }
    }

    function registerUser() {
      const nameInput = document.getElementById("username").value.trim();
      if(!nameInput) {
        alert("Please enter your name!");
        return;
      }

      currentUser = {
        userId: "usr_" + Math.random().toString(36).substr(2, 9),
        userName: nameInput,
        color: selectedColor
      };

      localStorage.setItem("ludo_tracker_user", JSON.stringify(currentUser));
      document.getElementById("registrationModal").style.display = "none";
      updateUserUI();
      fetchLiveData();
    }

    function updateUserUI() {
      if(!currentUser) return;
      document.getElementById("userGreeting").textContent = `Hey, ${currentUser.userName}`;
      document.getElementById("userAvatar").style.background = currentUser.color;
    }

    async function fetchLiveData() {
      try {
        document.getElementById("syncStatus").textContent = "● Syncing...";
        const res = await fetch(APPS_SCRIPT_URL);
        const data = await res.json();
        
        globalUsers = data.users || [];
        globalAttendanceData = data.attendance || [];

        document.getElementById("syncStatus").textContent = "● Live Sync";
        renderCalendar();
        updateLeaderboard();
      } catch(err) {
        console.error("Sync Error:", err);
        document.getElementById("syncStatus").textContent = "● Offline Mode";
        renderCalendar();
        updateLeaderboard();
      }
    }

    function renderCalendar() {
      const grid = document.getElementById("daysGrid");
      grid.innerHTML = "";

      const selMonth = parseInt(document.getElementById("monthSelect").value);
      const selYear = parseInt(document.getElementById("yearSelect").value);

      const firstDay = new Date(selYear, selMonth, 1).getDay();
      const totalDays = new Date(selYear, selMonth + 1, 0).getDate();

      const today = new Date();
      const todayStr = formatDate(today.getFullYear(), today.getMonth(), today.getDate());

      // Empty lead slots
      for(let i = 0; i < firstDay; i++) {
        const emptyDiv = document.createElement("div");
        emptyDiv.className = "day-card empty";
        grid.appendChild(emptyDiv);
      }

      for(let day = 1; day <= totalDays; day++) {
        const dateStr = formatDate(selYear, selMonth, day);
        const dayCard = document.createElement("div");
        dayCard.className = "day-card";

        if(dateStr === todayStr) {
          dayCard.classList.add("today");
        }

        const dayNum = document.createElement("span");
        dayNum.className = "day-number";
        dayNum.textContent = day;
        dayCard.appendChild(dayNum);

        // Filter attendance records for this specific date
        const dayRecords = globalAttendanceData.filter(r => r.dateStr === dateStr);
        const isCurrentPresent = currentUser && dayRecords.some(r => r.userId === currentUser.userId);

        if(isCurrentPresent) {
          dayCard.classList.add("present");
        }

        // Container for location pointers
        const ptrContainer = document.createElement("div");
        ptrContainer.className = "pointers-container";

        dayRecords.forEach(rec => {
          const isMe = currentUser && rec.userId === currentUser.userId;
          const isLatestActive = isMe && (activeLatestDateStr ? activeLatestDateStr === dateStr : dateStr === todayStr);

          const pin = document.createElement("div");
          pin.className = "pin";
          pin.style.background = rec.color;
          pin.title = rec.userName;

          if(isLatestActive) {
            pin.classList.add("active-big");
            const pulse = document.createElement("div");
            pulse.className = "pulse-wave";
            pulse.style.borderColor = rec.color;
            ptrContainer.appendChild(pulse);
          }

          ptrContainer.appendChild(pin);
        });

        dayCard.appendChild(ptrContainer);

        // Click Handler: Toggle attendance
        dayCard.onclick = () => toggleAttendance(dateStr, isCurrentPresent);

        grid.appendChild(dayCard);
      }
    }

    async function toggleAttendance(dateStr, isCurrentlyPresent) {
      if(!currentUser) {
        checkRegistration();
        return;
      }

      const newStatus = isCurrentlyPresent ? "DEFAULT" : "PRESENT";
      
      // Update local state instantly (Optimistic UI)
      if(newStatus === "PRESENT") {
        globalAttendanceData.push({
          userId: currentUser.userId,
          userName: currentUser.userName,
          color: currentUser.color,
          dateStr: dateStr
        });
        activeLatestDateStr = dateStr;
      } else {
        globalAttendanceData = globalAttendanceData.filter(
          r => !(r.userId === currentUser.userId && r.dateStr === dateStr)
        );
        if(activeLatestDateStr === dateStr) activeLatestDateStr = null;
      }

      renderCalendar();
      updateLeaderboard();

      // Send update to Google Sheet via text/plain to bypass CORS
      try {
        await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            userId: currentUser.userId,
            userName: currentUser.userName,
            color: currentUser.color,
            dateStr: dateStr,
            status: newStatus
          })
        });
        fetchLiveData();
      } catch(e) {
        console.error("Error pushing status:", e);
      }
    }

    function updateLeaderboard() {
      const container = document.getElementById("leaderboardList");
      container.innerHTML = "";

      const userCounts = {};

      globalAttendanceData.forEach(rec => {
        if(!userCounts[rec.userId]) {
          userCounts[rec.userId] = {
            userName: rec.userName,
            color: rec.color,
            count: 0
          };
        }
        userCounts[rec.userId].count += 1;
      });

      const sortedUsers = Object.values(userCounts).sort((a,b) => b.count - a.count);

      if(sortedUsers.length === 0) {
        container.innerHTML = `<div style="color: #64748b; font-size: 0.9rem;">No attendance recorded yet. Click a date to mark present!</div>`;
        return;
      }

      sortedUsers.forEach((u, index) => {
        const item = document.createElement("div");
        item.className = "leader-item";
        item.style.borderLeftColor = u.color;

        item.innerHTML = `
          <div class="leader-info">
            <span style="font-weight: bold; width: 20px;">#${index + 1}</span>
            <div style="width: 12px; height: 12px; border-radius: 50%; background: ${u.color}"></div>
            <span>${u.userName}</span>
          </div>
          <div style="font-weight: bold; color: var(--ludo-yellow);">${u.count} Days</div>
        `;
        container.appendChild(item);
      });
    }

    function formatDate(year, monthIndex, day) {
      const m = String(monthIndex + 1).padStart(2, '0');
      const d = String(day).padStart(2, '0');
      return `${year}-${m}-${d}`;
    }
  </script>
</body>
</html>
